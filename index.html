<style>
/* Layout: 小さな題字 → 全シナリオ検索 → シナリオのカードを新しい順に並べる。カードを押すと全画面に広がり、そのシナリオのガイドが開く。
   色は霧がかった灰色を台紙に、シナリオごとの色はカードと上のバーだけに出す */
@property --sc { syntax: "<color>"; inherits: true; initial-value: #0a73a3; }
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --ink:#141a24; --ink-2:#3a4352; --muted:#5f6878;
  --line:#dadfe6; --focus:#2f6fd6;
  --f-display:"Instrument Serif","Times New Roman",serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
  --sc:#0a73a3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1016; --surface:#151a22; --surface-2:#1b212b; --ink:#e9edf3; --ink-2:#b7c0cd; --muted:#8a94a4;
  --line:#262d39; --focus:#7fb0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#151a22; --surface-2:#1b212b; --ink:#e9edf3; --ink-2:#b7c0cd; --muted:#8a94a4;
  --line:#262d39; --focus:#7fb0ff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 var(--f-jp);word-break:auto-phrase}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1040px;margin:0 auto}

/* 題字 */
.top{padding-block:28px 8px}
.top .inner{display:flex;align-items:flex-start;gap:16px;justify-content:space-between}
.brand small{display:block;font:500 11px/1 var(--f-mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.brand h1{margin:8px 0 0;font:400 clamp(30px,5vw,44px)/1.1 var(--f-display);letter-spacing:-.01em}
.brand h1 span{font-family:var(--f-jp);font-weight:700;font-size:.62em;letter-spacing:.02em;margin-left:.3em}
.brand p{margin:8px 0 0;color:var(--muted);font-size:13px}
.theme{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.theme svg{width:16px;height:16px}

/* 検索 */
.find{padding-block:18px 6px}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.search:focus-within{border-color:var(--focus)}
.search svg{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:2}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.search button{border:0;background:var(--surface-2);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.hits{margin-top:12px;display:grid;gap:8px}
.hits .meta{font-size:12px;color:var(--muted)}
.hit{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.hit:hover{border-color:var(--c)}
.hit .tag{grid-row:span 2;align-self:start;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;color:#fff;background:var(--c);white-space:nowrap}
.hit b{font-weight:700;min-width:0}
.hit b em{font-style:normal;font-weight:500;font-size:12px;color:var(--muted);margin-left:8px}
.hit span.d{min-width:0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* シナリオカード */
.pick{padding-block:26px 40px}
.pick h2{margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{position:relative;overflow:hidden;text-align:left;border:0;border-radius:20px;padding:22px 22px 20px;min-height:230px;cursor:pointer;color:#fff;
  background:var(--card-bg);display:flex;flex-direction:column;justify-content:flex-end;gap:6px;isolation:isolate;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px -16px var(--c)}
.card:active{transform:scale(.985)}
.card .fx{position:absolute;inset:0;z-index:-1;pointer-events:none}
.card .en{font:400 italic 15px/1 var(--f-display);opacity:.8}
.card h3{margin:0;font-size:26px;font-weight:900;letter-spacing:.04em;line-height:1.25}
.card p{margin:0;font-size:13px;line-height:1.65;opacity:.88;max-width:34em}
.card .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font:500 12px/1 var(--f-mono);opacity:.9}
.card .badge{font-family:var(--f-jp);font-weight:700;font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35)}
.card .badge.now::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#7dffb0;margin-right:6px;vertical-align:1px;animation:blink 2s ease-in-out infinite}
.card .go{position:absolute;top:18px;right:18px;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
.soon{border:1.5px dashed var(--line);border-radius:20px;min-height:230px;display:grid;place-content:center;text-align:center;color:var(--muted);font-size:13px;padding:20px}
.soon b{display:block;font-size:15px;color:var(--ink-2);margin-bottom:4px}

/* カードの中の小さな動き */
.ray{position:absolute;top:-20%;width:18%;height:140%;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 75%);transform:rotate(14deg);filter:blur(6px);animation:sway 9s ease-in-out infinite alternate}
.bub{position:absolute;bottom:-12px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);animation:rise linear infinite}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.6);animation:twinkle ease-in-out infinite}
.moon{position:absolute;top:18px;right:84px;width:34px;height:34px;border-radius:50%;box-shadow:-7px 5px 0 0 #f3d98b;transform:rotate(-20deg);opacity:.9}
@keyframes sway{from{translate:-12px 0}to{translate:18px 0}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-280px);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{50%{opacity:.35}}

footer{padding-block:20px 36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
footer .inner{display:grid;gap:4px}
footer a{color:inherit}

/* ガイドを開いた画面 */
.stage{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg)}
.sbar{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:10px;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;
  background:var(--sc);color:#fff;transition:--sc .7s var(--ease)}
.sbar .btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap}
.sbar .btn svg{width:16px;height:16px}
.sbar .grow{flex:1}
.menu{position:relative}
.menu-list{position:absolute;top:calc(100% + 8px);left:0;min-width:240px;padding:6px;border-radius:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 18px 40px -18px rgba(0,0,0,.45);display:grid;gap:2px}
.menu-list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px}
.menu-list button:hover,.menu-list button[aria-current="true"]{background:var(--surface-2)}
.menu-list i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.menu-list small{margin-left:auto;font-size:11px;color:var(--muted)}
.frames{position:relative;flex:1;min-height:0;background:var(--bg)}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}

/* カード→全画面の変形（View Transitions。対応していない端末ではすぐ切り替わる） */
::view-transition-group(stage){animation-duration:.5s;animation-timing-function:var(--ease)}
::view-transition-old(stage),::view-transition-new(stage){height:100%;object-fit:cover}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}

@media (max-width:520px){.sbar .lbl{display:none}.card h3{font-size:22px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}::view-transition-group(*){animation:none!important}}
</style>
</head>

スリーパーの討伐数がかぎ。","k":"しなりお栄光","t":"しなりお栄光gloryrewardしなりお栄光いちばん上の栄光にはすこあ500が必要。えたーなるすりーぱーの討伐数がかぎ。しゃろう1体1pt(上限200)でぃーぷ1体2pt(上限200)えたーなる1体3pt(上限なし)もらえる物すたーとろふぃー・夢の修道者(施設)しゃろうとでぃーぷはすぐ上限になるので、えたーなるを100体以上倒すのが大事とされる(攻略記事)。eternalwebdbゆめえいこう"},{"s":"dream","n":"シナリオチャレンジ","a":"","c":"報酬・商人","d":"ステージ2から開く課題。4つのチャプターで蝶の証と現実の残片がもらえる。","k":"しなりおちゃれんじ","t":"しなりおちゃれんじchallengerewardしなりおちゃれんじすてーじ2から開く課題。4つのちゃぷたーで蝶の証と現実の残片がもらえる。初めての次元界蝶の証750・残片1200荒野へ向かって蝶の証900・残片1350虎穴に入る蝶の証1050・残片1650最も暗い刻蝶の証1200・残片1800全部くりあしたときの報酬(攻略記事、2025年8月時点)浄化貢献度はしゃろう5pt・でぃーぷ12ptすてーじ6以降は浄化貢献度が加算されず、そのちゃれんじはくりあできなくなるstage2shardoffwebげんじつのざんぺんざんぺんげんじつちょうのあかし"}];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const norm = s => String(s).normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/\s+/g, "");
const byId = Object.fromEntries(SCENARIOS.map(s => [s.id, s]));
const count = id => INDEX.filter(x => x.s === id).length;
const motion = !matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- ダーク/ライト（親で決めて、開いているガイドにも伝える） ---- */
const root = document.documentElement;
const sys = () => matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
const curTheme = () => root.dataset.theme || sys();
try { const t = localStorage.getItem("hub-theme"); if (t === "dark" || t === "light") root.dataset.theme = t; } catch (e) {}
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function showTheme(){
  const t = curTheme(), html = t === "dark" ? MOON + "ダーク" : SUN + "ライト";
  $("#theme").innerHTML = html; $("#theme2").innerHTML = html;
  frames.forEach(f => f.contentWindow && f.contentWindow.postMessage({ type:"theme", v:t }, "*"));
  if (cur) paintBar(cur);
}
function toggleTheme(){
  const next = curTheme() === "dark" ? "light" : "dark";
  root.dataset.theme = next; try { localStorage.setItem("hub-theme", next); } catch (e) {}
  showTheme();
}
$("#theme").addEventListener("click", toggleTheme);
$("#theme2").addEventListener("click", toggleTheme);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", showTheme);

/* ---- カード ---- */
function fx(s){
  let h = "";
  const r = (a, b) => (a + Math.random() * (b - a)).toFixed(1);
  if (s.fx === "sea"){
    [8, 38, 66].forEach((x, i) => h += `<span class="ray" style="left:${x}%;animation-delay:-${i * 3}s;animation-duration:${8 + i * 2}s"></span>`);
    for (let i = 0; i < 9; i++){ const z = r(4, 11); h += `<span class="bub" style="left:${r(4, 96)}%;width:${z}px;height:${z}px;animation-duration:${r(7, 13)}s;animation-delay:-${r(0, 12)}s"></span>`; }
  } else if (s.fx === "stars"){
    h += `<span class="moon"></span>`;
    for (let i = 0; i < 26; i++) h += `<span class="star" style="left:${r(2, 98)}%;top:${r(4, 70)}%;animation-duration:${r(2.4, 5)}s;animation-delay:-${r(0, 5)}s;scale:${r(.6, 1.4)}"></span>`;
  }
  return h;
}
$("#cards").innerHTML = SCENARIOS.map(s => `
  <button type="button" class="card" data-id="${s.id}" style="--card-bg:${s.bg};--c:${s.light}">
    <span class="fx" aria-hidden="true">${fx(s)}</span>
    <span class="go">開く →</span>
    <span class="en">${esc(s.en)}</span>
    <h3>${esc(s.name)}</h3>
    <p>${esc(s.desc)}</p>
    <span class="row"><span class="badge ${s.status === "now" ? "now" : ""}">${s.status === "now" ? "開催中" : "過去のシナリオ"}</span>${esc(s.period)}　·　${count(s.id)}項目</span>
  </button>`).join("") + `<div class="soon"><div><b>次のシナリオ</b>ここに追加していきます</div></div>`;
$("#cards").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) open(c.dataset.id, null, c); });

/* ---- ガイドを開く ---- */
const frames = new Map(), ready = new Set(), pendingQ = {};
let cur = null, fromCard = null;
function frameFor(id, tab){
  if (!frames.has(id)){
    const f = document.createElement("iframe");
    f.title = byId[id].name + " ガイド";
    f.src = `s/${id}.html?theme=${curTheme()}` + (tab ? "#" + tab : "");
    $("#frames").appendChild(f); frames.set(id, f);
  }
  return frames.get(id);
}
addEventListener("message", e => {
  const m = e.data || {};
  if (m.type === "full"){ const f = frames.get(cur); if (f && e.source === f.contentWindow) $(".sbar").hidden = !!m.v; return; }
  if (m.type !== "ready") return;
  ready.add(m.id);
  const f = frames.get(m.id); if (!f || e.source !== f.contentWindow) return;
  f.contentWindow.postMessage({ type:"theme", v:curTheme() }, "*");
  if (pendingQ[m.id]){ f.contentWindow.postMessage({ type:"q", v:pendingQ[m.id] }, "*"); delete pendingQ[m.id]; }
});
function sendQ(id, q){
  if (!q) return;
  const f = frames.get(id);
  if (ready.has(id)) f.contentWindow.postMessage({ type:"q", v:q }, "*"); else pendingQ[id] = q;
}
function paintBar(id){ const s = byId[id]; root.style.setProperty("--sc", curTheme() === "dark" ? s.dark : s.light); }
function select(id, tab){
  cur = id; paintBar(id); $(".sbar").hidden = false;
  frameFor(id, tab);
  frames.forEach((f, k) => f.hidden = k !== id);
  $("#curName").textContent = byId[id].name;
  $("#menuList").querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b.dataset.id === id));
  try { localStorage.setItem("hub-last", id); } catch (e) {}
}
function transition(fn){
  if (motion && document.startViewTransition) return document.startViewTransition(fn);
  fn(); return null;
}
function open(id, q, card){
  fromCard = card || document.querySelector(`.card[data-id="${id}"]`);
  if (fromCard && motion) fromCard.style.viewTransitionName = "stage";
  transition(() => {
    if (fromCard) fromCard.style.viewTransitionName = "";
    $("#stage").style.viewTransitionName = "stage";
    $("#stage").hidden = false;
    document.body.style.overflow = "hidden";
    select(id);
  });
  sendQ(id, q);
  history.replaceState(null, "", "#" + id);
}
function close(){
  const card = document.querySelector(`.card[data-id="${cur}"]`);
  transition(() => {
    $("#stage").style.viewTransitionName = "";
    $("#stage").hidden = true;
    document.body.style.overflow = "";
    if (card && motion) card.style.viewTransitionName = "stage";
  })?.finished.finally(() => { if (card) card.style.viewTransitionName = ""; });
  closeMenu();
  history.replaceState(null, "", location.pathname + location.search);
}
$("#back").addEventListener("click", close);

/* ---- シナリオ切り替えメニュー ---- */
$("#menuList").innerHTML = SCENARIOS.map(s => `<button type="button" data-id="${s.id}" style="--c:${s.light}"><i></i>${esc(s.name)}<small>${s.status === "now" ? "開催中" : esc(s.period)}</small></button>`).join("");
const closeMenu = () => { $("#menuList").hidden = true; $("#menuBtn").setAttribute("aria-expanded", "false"); };
$("#menuBtn").addEventListener("click", e => { e.stopPropagation(); const h = !$("#menuList").hidden; $("#menuList").hidden = h; $("#menuBtn").setAttribute("aria-expanded", String(!h)); });
$("#menuList").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; closeMenu(); if (b.dataset.id !== cur){ select(b.dataset.id); history.replaceState(null, "", "#" + b.dataset.id); } });
document.addEventListener("click", e => { if (!e.target.closest(".menu")) closeMenu(); });
addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

/* ---- 全シナリオ検索 ---- */
let qt;
function search(){
  const raw = $("#q").value.trim(), q = norm(raw);
  $("#qx").hidden = !raw;
  const box = $("#hits");
  if (!q){ box.hidden = true; box.innerHTML = ""; return; }
  const scored = [];
  for (const x of INDEX){
    const sc = x.k.startsWith(q) ? 3 : x.k.includes(q) ? 2 : x.t.includes(q) ? 1 : 0;
    if (sc) scored.push([sc, x]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  const list = scored.slice(0, 40).map(([, x]) => x);
  const per = SCENARIOS.map(s => `${s.name} ${scored.filter(([, x]) => x.s === s.id).length}件`).join("・");
  box.hidden = false;
  box.innerHTML = `<div class="meta">「${esc(raw)}」 ${per}${scored.length > 40 ? "（上位40件を表示）" : ""}</div>` +
    (list.length ? list.map(x => { const s = byId[x.s]; return `<button type="button" class="hit" data-s="${x.s}" data-n="${esc(x.n)}" style="--c:${s.light}"><span class="tag">${esc(s.name)}</span><b>${esc(x.n)}<em>${esc(x.c)}</em></b><span class="d">${esc(x.d)}</span></button>`; }).join("")
      : `<div class="meta">見つかりませんでした。ひらがなや別の名前でも探してみてください。</div>`);
}
$("#q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(search, 100); });
$("#qx").addEventListener("click", () => { $("#q").value = ""; search(); $("#q").focus(); });
$("#hits").addEventListener("click", e => { const b = e.target.closest(".hit"); if (b) open(b.dataset.s, b.dataset.n); });

/* ---- 起動 ---- */
showTheme();
const h = location.hash.slice(1);
const hs = byId[h] || SCENARIOS.find(s => (s.tabs || []).includes(h));
if (hs){ $("#stage").hidden = false; document.body.style.overflow = "hidden"; select(hs.id, hs.id === h ? "" : h); }
</script>
